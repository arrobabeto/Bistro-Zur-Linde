name: Revalidate CDN after production deploy

# Fires when Vercel marks a GitHub deployment as successful.
# Requires repo secrets: REVALIDATE_SECRET, PRODUCTION_SITE_URL
# (e.g. https://www.bistrozurlinde.ch).

on:
  deployment_status:

concurrency:
  group: cdn-revalidate-${{ github.event.deployment.sha }}
  cancel-in-progress: true

jobs:
  revalidate:
    if: >
      github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'Production' ||
       github.event.deployment.environment == 'production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Invalidate Astro CDN tags
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          PUBLIC_SITE_URL: ${{ secrets.PRODUCTION_SITE_URL }}
        run: pnpm run cdn:revalidate
